version: '3.8'
services:
  artificial-generation-backend:
    build:
      context: ./ArtificialGenerationBackend
      target: development
    ports:
      - "8000:8000"
      - "8080:8080"
      - "8085:8085"
    environment:
      - SERVER_PORT=8080
    volumes:
      - ./ArtificialGenerationBackend/:/app