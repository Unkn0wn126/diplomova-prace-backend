version: '3.8'
services:
  artificial-generation-backend:
    container_name: "artificial_generation_spring"
    build:
      context: ./ArtificialGenerationBackend
      target: development
    ports:
      - "8000:8000"
      - "8080:8080"
      - "8085:8085"
    environment:
      - SERVER_PORT=8080
      - SOCKET-SERVER_PORT=8085
      - SOCKET-SERVER_HOST=0.0.0.0
      - SPRING_RABBITMQ_HOST=artificial-generation-rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_PASSWORD=mypassword
      - SPRING_RABBITMQ_USERNAME=myuser
      - QUEUES_MODEL-PARSING_REQUEST=modelParsingRequest
      - QUEUES_MODEL-PARSING_RESPONSE=modelParsingResponse
      - QUEUES_SCENE-GENERATION_REQUEST=sceneGenerationRequest
      - QUEUES_SCENE-GENERATION_RESPONSE=sceneGenerationResponse
      - QUEUES_EXCHANGE=artificial-generation-exchange
    depends_on:
      - rabbitmq3
    volumes:
      - ./ArtificialGenerationBackend/:/app
  artificial-generation-workers:
    container_name: "artificial_generation_python"
    build:
      context: ./ArtificialGenerationWorkers
    ports:
      - 5678:5678
    environment:
      - RABBIT_HOST=artificial-generation-rabbitmq
      - RABBIT_PORT=5672
      - RABBIT_USERNAME=myuser
      - RABBIT_PASSWORD=mypassword
      - SCENE_GENERATION_WORKERS_COUNT=16
      - MODEL_PARSING_WORKERS_COUNT=1
      - MODEL_PARSING_MIN_WORKERS_COUNT=1
      - QUEUES_MODEL-PARSING_REQUEST=modelParsingRequest
      - QUEUES_MODEL-PARSING_RESPONSE=modelParsingResponse
      - QUEUES_SCENE-GENERATION_REQUEST=sceneGenerationRequest
      - QUEUES_SCENE-GENERATION_RESPONSE=sceneGenerationResponse
      - QUEUES_EXCHANGE=artificial-generation-exchange
    restart: always
    depends_on:
      - rabbitmq3
    volumes:
      - ./ArtificialGenerationWorkers/:/app
  rabbitmq3:
    container_name: "artificial-generation-rabbitmq"
    image: rabbitmq:3.8-management-alpine
    environment:
      - RABBITMQ_DEFAULT_USER=myuser
      - RABBITMQ_DEFAULT_PASS=mypassword
    ports:
      # AMQP protocol port
      - '5672:5672'
      # HTTP management UI
      - '15672:15672'