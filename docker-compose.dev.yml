version: '3.8'
services:
  artificial-generation-backend:
    container_name: "artificial_generation_spring"
    build:
      context: ./ArtificialGenerationBackend
      target: development
    ports:
      - "8000:8000"
      - "8080:8080"
      - "8085:8085"
    environment:
      - SERVER_PORT=8080
    depends_on:
      - rabbitmq3
    volumes:
      - ./ArtificialGenerationBackend/:/app
  artificial-generation-workers:
    container_name: "artificial_generation_python"
    build:
      context: ./ArtificialGenerationWorkers
    ports:
      - 5678:5678
    restart: always # TODO: change it so it's not needed
    depends_on:
      - rabbitmq3
    volumes:
      - ./ArtificialGenerationWorkers/:/app
  rabbitmq3:
    # see https://www.section.io/engineering-education/dockerize-a-rabbitmq-instance/
    container_name: "artificial-generation-rabbitmq"
    image: rabbitmq:3.8-management-alpine
    environment:
      - RABBITMQ_DEFAULT_USER=myuser
      - RABBITMQ_DEFAULT_PASS=mypassword
    ports:
      # AMQP protocol port
      - '5672:5672'
      # HTTP management UI
      - '15672:15672'