api:
  base-path: /api/v1

models-controller:
  base-path: models
  start-operation:
    path: parseModelFromFile
  get-value:
    path: getParsedModel

scenes-controller:
  base-path: scenes
  start-operation:
    path: generateScenes
  get-value:
    path: getGeneratedScene

socket-server:
  port: 8085
  host: 0.0.0.0

server:
  port: 8080

queues:
  exchange: artificial-generation-exchange
  model-parsing:
    request: modelParsingRequest
    response: modelParsingResponse
  scene-generation:
    request: sceneGenerationRequest
    response: sceneGenerationResponse


spring:
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  rabbitmq:
    host: localhost
    port: 5672
    password: mypassword
    username: myuser
