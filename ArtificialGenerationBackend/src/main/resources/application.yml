api:
  base-path: /api/v1

models-controller:
  base-path: models
  start-operation:
    path: parseModelFromFile
  get-value:
    path: getParsedModel

scenes-controller:
  base-path: scenes
  start-operation:
    path: generateScenes
  get-value:
    path: getGeneratedScene

socket-server:
  port: 8085
  host: localhost

server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  rabbitmq:
    host: localhost
    port: 5672
    password: mypassword
    username: myuser
